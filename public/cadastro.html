<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <link rel="stylesheet" href="../assets/style/style.css">
    <title>Criar uma Conta Strain</title>


</head>

<body>
    <header>
        <nav>
        </nav>
    </header>

    <main>
        <div class="container_cadastro">
            <h2 id="titulo_cadastro">Criar uma Conta Strain</h2>
            <form id="form_cadastro">
                <div class="conjunto">
                    <label for="usuario" class="form-label"></label>
                    <input type="text" id="usuario" placeholder="Nome de usuário" required>
                </div>
                <div class="conjunto">
                    <label for="email" class="form-label"></label>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                </div>
                <div class="conjunto">
                    <label for="senha" class="form-label"></label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>
                <button id="botao_cadastro" type="submit" class="btn btn-outline-danger">Cadastrar</button>
            </form>
            <a href="login.html">JÁ TENHO CONTA</a>
        </div>
    </main>


    <footer></footer>
    <script src="script.js"></script>
</body>

</html>
