<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strain</title>

    <link rel="stylesheet" href="./assets/style/style.css">

</head>

<body class="body_index">
    <nav class="navbar">

        <div class="logo-navbar" id="logoNavbar">
            <img src="assets/img/logo_navbar2.png" alt="Logo Strain">
        </div>

        <button class="btn">Entrar</button>

    </nav>

    <section class="banner">

        <div class="logo-banner">
            <img src="assets/img/banner_logo2.png" alt="Logo Grande">
        </div>

    </section>

    <main class="blue.index">

        <div class="container_index">
             
            <div class="flex2">
    <div> 
        <H3><b>Linhas disponíveis em Joinville SC </b></H3>
    </div>
            
                <button id="botao_index" type="submit" class="btn btn-outline2">Linha Azul (Sul)</button>

                <button id="botao_index" type="submit" class="btn btn-outline2">Linha Verde (Centro)</button>

                <button id="botao_index" type="submit" class="btn btn-outline2">Linha Amarela (Itaum)</button>

                <button id="botao_index" type="submit" class="btn btn-outline2">Linha Vermelha (Villa
                    Nova)</button>

            </div>

      
   
        
            <img class="Mapa" src="assets/img/Mapa.png" alt="Mapa dos trens">
        </div>
        </main>
 
        <script>

            window.addEventListener("scroll", function () {

                const logoNavbar = document.getElementById("logoNavbar");

                if (window.scrollY > 200) {
                    logoNavbar.classList.add("show");
                } else {
                    logoNavbar.classList.remove("show");
                }

            });

        </script>

</body>

</html>
